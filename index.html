<!doctype html>
<html lang="en">
<head>

<title>LiteTUI · Sidecar preview</title>
<style>
:root{color-scheme:dark;font-family:"Segoe UI",Arial,sans-serif;background:#0a0a0b;color:#e8e4dc}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}.app{height:100vh;min-height:650px;display:flex;flex-direction:column;background:#131314}header{height:62px;background:#1b1b1d;border-bottom:1px solid #27272a;display:flex;align-items:center;justify-content:space-between;padding:0 23px;gap:12px}.brand{font-size:17px;font-weight:700;white-space:nowrap}.brand b{color:#d4a853}.brand em{font-style:normal;font-weight:400;color:#9e9a92}.badge{display:inline-block;border:1px solid #3d3a35;padding:6px 9px;margin-left:15px;font-size:9px;letter-spacing:1px;color:#9e9a92}.tabs{display:flex;gap:3px}.tabs button{border:0;background:transparent;color:#9e9a92;padding:11px 17px;font-size:12px}.tabs button.active{color:#0a0a0b;background:#e8e4dc;border-radius:2px}.status{font-size:10px;letter-spacing:1px;color:#9e9a92}.status i{display:inline-block;width:6px;height:6px;background:#4a8c5e;border-radius:50%;margin-right:8px}.titlebar{height:78px;border-bottom:1px solid #27272a;display:flex;align-items:center;justify-content:space-between;padding:10px 25px}.eyebrow{font-size:10px;color:#9e9a92;letter-spacing:1.5px;font-weight:700}.titlebar h1{font-weight:500;font-size:22px;margin:6px 0}.gold{background:#d4a853;color:#0a0a0b;border:0;border-radius:2px;padding:10px 17px;font-size:11px;font-weight:700}.gold:disabled{opacity:.4;cursor:default}.stage{flex:1;min-height:0;display:grid;grid-template-columns:24% 1fr 24%}.rail,.right{background:#1b1b1d;overflow:auto}.rail{border-right:1px solid #27272a;padding:20px 14px}.rail h2,.center h2,.right h2{font-weight:500;font-size:17px;margin:7px 0 14px}.filters,.switch{display:flex;gap:4px}.filters button,.switch button{background:transparent;color:#9e9a92;border:0;padding:9px 11px;font-size:10px}.filters button.active,.switch button.active{background:#d4a853;color:#0a0a0b}input{border:1px solid #3d3a35;background:#131314;color:#e8e4dc;padding:9px;width:100%;outline:none}.search{margin:14px 0}.job{display:block;width:100%;text-align:left;border:1px solid #3d3a35;border-left:3px solid #d4a853;background:#242426;color:#e8e4dc;padding:15px;margin:9px 0;min-height:105px}.job:hover{background:#302d29}.job.orange{border-left-color:#d18a5f}.job.yellow{border-left-color:#bbaa67}.job.rose{border-left-color:#a86e73}.job small,.job strong,.job span{display:block}.job small{color:#d4a853;font-size:9px;letter-spacing:.6px}.job strong{font-size:12px;font-weight:500;margin:11px 0}.job span{color:#9e9a92;font-size:10px}.center{padding:19px 15px;overflow:auto}.centerhead,.righthead{display:flex;align-items:center;justify-content:space-between}.switch{border:1px solid #3d3a35}.switch button.active{background:#e8e4dc}.ruler{display:flex;justify-content:space-between;color:#9e9a92;font-size:10px;margin-top:24px;padding-bottom:13px}.grid{height:calc(100vh - 318px);min-height:335px;position:relative;border-top:1px dashed #3d3a35;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 1px),#27272a calc(10% - 1px),#27272a 10%),repeating-linear-gradient(0deg,transparent 0,transparent 117px,#27272a 118px)}.now{position:absolute;left:35%;top:0;bottom:0;width:1px;background:#d4a853;pointer-events:none}.now span{position:absolute;top:-19px;left:-24px;background:#d4a853;color:#0a0a0b;font-size:9px;padding:3px;white-space:nowrap}.block{position:absolute;width:37%;background:#242426;border:1px solid #3d3a35;border-left:3px solid #d4a853;color:#e8e4dc;text-align:left;padding:13px;min-height:95px}.block:nth-of-type(2){top:12px;left:9%}.block:nth-of-type(3){top:120px;left:32%;border-left-color:#d18a5f}.block:nth-of-type(4){top:238px;left:53%;border-left-color:#bbaa67}.block:nth-of-type(5){top:352px;left:69%;width:30%;border-left-color:#a86e73}.block small{font-size:9px;color:#d4a853}.block strong{display:block;margin:10px 0 6px;font-size:12px;font-weight:500}.block span{color:#9e9a92;font-size:10px}.right{border-left:1px solid #27272a;padding:19px 13px;display:flex;flex-direction:column}.switch.ws{border:0;border-bottom:1px solid #27272a}.switch.ws button.active{color:#d4a853;background:transparent;border-bottom:2px solid #d4a853}.address{margin:14px 0}.canvas{flex:1;min-height:270px;background:radial-gradient(circle at center,#26231c,#131314 65%);border:1px solid #27272a;display:grid;place-items:center;text-align:center;padding:20px}.orb{width:76px;height:76px;border:1px solid #d4a853;color:#d4a853;border-radius:50%;display:grid;place-items:center;margin:0 auto 28px;font-size:27px;box-shadow:0 0 0 15px #d4a85313}.canvas p{color:#9e9a92;font-size:11px;line-height:1.6}.foot{padding:10px 14px;border-top:1px solid #27272a;color:#9e9a92;font-size:9px;letter-spacing:1px}.month{display:grid;grid-template-columns:repeat(7,1fr);height:calc(100vh - 282px);min-height:380px}.month button{border:1px solid #27272a;background:#1b1b1d;color:#e8e4dc;text-align:left;padding:10px;vertical-align:top}.month button:hover,.month button.today{background:#2c2923;color:#d4a853}.month .day{font-size:9px;color:#9e9a92;height:35px;text-align:center;background:#242426}.week{display:grid;grid-template-columns:repeat(7,1fr);height:calc(100vh - 280px)}.week>div{border:1px solid #27272a;padding:10px;font-size:11px}.week button{margin-top:30px;width:100%;text-align:left;background:#242426;border:1px solid #3d3a35;border-left:3px solid #d4a853;color:#e8e4dc;padding:8px;font-size:10px}.setting{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;color:#9e9a92;padding:13px;font-size:11px}.setting.active,.setting:hover{background:#242426;color:#e8e4dc;border-color:#3d3a35}.setting small{display:block;margin-top:4px;color:#9e9a92}.settingsPanel{padding:32px 35px;overflow:auto}.settingsPanel h2{font-size:30px;font-weight:500}.settingsPanel p{color:#9e9a92;font-size:11px;line-height:1.6}.card{border:1px solid #3d3a35;background:#242426;margin:20px 0}.card h3{font-size:12px;font-weight:500;margin:0;padding:17px;border-bottom:1px solid #3d3a35}.row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:19px;border-bottom:1px solid #3d3a35;font-size:11px}.row:last-child{border:0}.row select{background:#131314;color:#e8e4dc;border:1px solid #3d3a35;padding:7px}.row input{width:16px}.aside{border-left:1px solid #27272a;background:#1b1b1d;padding:32px 20px}.aside strong{display:block;color:#d4a853;font-size:42px;margin-top:30px}.aside p{color:#9e9a92;font-size:11px;line-height:1.6}.scrim{position:fixed;inset:0;background:#000b;display:grid;place-items:center}.dialog{background:#242426;border:1px solid #6b6760;width:min(440px,90vw);padding:23px;box-shadow:0 20px 60px #000a}.dialog h2{font-weight:500}.dialog p{color:#9e9a92;font-size:12px;line-height:1.7}.dialog .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.dialog button{padding:10px;border:1px solid #3d3a35;color:#e8e4dc;background:#1b1b1d}.dialog .gold{background:#d4a853;color:#0a0a0b}.disconnected{color:#d4a853;font-size:10px}.artifact{border:1px solid #3d3a35;background:#242426;padding:14px;margin:10px 0;color:#e8e4dc;text-align:left}.artifact small{color:#9e9a92;display:block;margin-top:6px}@media(max-width:1000px){.stage{grid-template-columns:210px 1fr}.right{grid-column:1/3;min-height:360px}.status{display:none}}@media(max-width:650px){header{flex-wrap:wrap;height:auto;padding:11px}.tabs{order:3;width:100%;justify-content:space-around}.badge{display:none}.stage{display:block}.rail{max-height:230px}.center{min-height:600px}.right{min-height:360px}.block{width:45%}.block:nth-of-type(5){width:35%;left:63%}}
</style>
</head>
<body><div class="app"><header><div class="brand"><b>≋</b> LiteTUI <em>/ sidecar</em><span class="badge">EARLY NATIVE PREVIEW</span></div><nav class="tabs" id="navigation"></nav><div class="status"><i></i> LOCAL WORKSPACE</div></header><div class="titlebar"><div><span class="eyebrow" id="breadcrumb"></span><h1 id="heading"></h1></div><button class="gold" id="create">+ Create new ▾</button></div><div id="stage" class="stage"></div><div class="foot">DESIGN PREVIEW ONLY · NO PARENT CONNECTION, SAVES, JOBS, OR BROWSER NAVIGATION</div></div><div id="modal"></div>
<script>
const jobs=[{name:'Morning briefing',detail:'Every weekday · 09:00',kind:'Agent job',color:''},{name:'Review pull requests',detail:'Mon / Wed / Fri · 11:30',kind:'Agent job',color:'orange'},{name:'Design sync',detail:'Today · 14:00',kind:'Personal event',color:'yellow'},{name:'Artifact check',detail:'Every day · 16:30',kind:'Agent job',color:'rose'}];
const categories=['Model','NInfer','Voice','Generation','Agent loop','Compaction','Capabilities','Hooks','Themes','Interface'];
let section=location.hash==='#settings'?'Settings':location.hash==='#calendar'?'Calendar':'Timeline',view=location.hash==='#calendar'?'Month':'Timeline',workspace='Browser',filter='All',category='Model';
const $=id=>document.getElementById(id);
function escapeHtml(text){return String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function modal(kind){const title=kind==='error'?'Preview unavailable':kind==='event'?'Personal event':kind==='recurrence'?'Change the whole series?':kind==='new'?'Create agent job':jobs[Number(kind)]?.name||'Agent job';$('modal').innerHTML=`<div class="scrim"><section class="dialog" role="dialog" aria-modal="true"><div class="eyebrow">LITETUI / PREVIEW</div><h2>${escapeHtml(title)}</h2><p>${kind==='error'?'The browser and artifact panels are not connected to a real WebView yet. No navigation occurred.':kind==='recurrence'?'Recurring edits will show before/after schedules and future occurrences before confirmation. Nothing was changed.':'This native window is a presentation preview. Scheduling, settings, and agent execution require the future LiteTUI parent link. Nothing here is saved.'}</p><div class="actions"><button id="dismiss">Close preview</button></div></section></div>`;$('dismiss').onclick=()=>{$('modal').innerHTML=''};$('modal').querySelector('.scrim').onclick=e=>{if(e.target.classList.contains('scrim'))$('modal').innerHTML=''}}
function render(){
$('navigation').innerHTML=['Timeline','Calendar','Settings'].map(s=>`<button data-section="${s}" class="${section===s?'active':''}">${s}</button>`).join('');document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{section=b.dataset.section;render()});$('breadcrumb').textContent=`WORKSPACE / ${section.toUpperCase()}`;$('heading').textContent=section==='Timeline'?"Today’s overview":section;$('create').textContent=section==='Settings'?'No saving in preview':'+ Create new ▾';$('create').disabled=section==='Settings';$('create').onclick=()=>modal('new');
if(section==='Settings'){renderSettings();return}
const visible=jobs.filter(j=>filter==='All'||(filter==='Jobs'?j.kind==='Agent job':j.kind==='Personal event'));
$('stage').innerHTML=`<aside class="rail"><div class="eyebrow">SCHEDULED</div><h2>Jobs (${visible.length})</h2><div class="filters">${['All','Jobs','Events'].map(f=>`<button data-filter="${f}" class="${filter===f?'active':''}">${f}</button>`).join('')}</div><input class="search" placeholder="Search schedule" id="search">${visible.map(j=>`<button class="job ${j.color}" data-job="${jobs.indexOf(j)}"><small>${j.kind.toUpperCase()}</small><strong>${j.name}</strong><span>${j.detail}</span></button>`).join('')}</aside><main class="center"><div class="centerhead"><div><span class="eyebrow">SEPTEMBER 2026</span><h2>${view}</h2></div><div class="switch">${['Timeline','Week','Month'].map(v=>`<button data-view="${v}" class="${view===v?'active':''}">${v}</button>`).join('')}</div></div><div id="calendar"></div></main><aside class="right"><div class="righthead"><div><span class="eyebrow">RIGHT WORKSPACE</span><h2>${workspace}</h2></div><button id="more" style="border:0;background:transparent;color:#9e9a92">•••</button></div><div class="switch ws">${['Browser','Artifacts'].map(w=>`<button data-workspace="${w}" class="${workspace===w?'active':''}">${w}</button>`).join('')}</div><div id="workspace"></div></aside>`;
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelectorAll('[data-job]').forEach(b=>b.onclick=()=>modal(b.dataset.job));document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;section=b.dataset.view==='Timeline'?'Timeline':'Calendar';render()});document.querySelectorAll('[data-workspace]').forEach(b=>b.onclick=()=>{workspace=b.dataset.workspace;render()});$('more').onclick=()=>modal('error');$('search').oninput=e=>{document.querySelectorAll('.job').forEach(j=>j.hidden=!j.textContent.toLowerCase().includes(e.target.value.toLowerCase()))};
const cal=$('calendar');if(view==='Timeline'){cal.innerHTML=`<div class="ruler">${['8 AM','9 AM','10 AM','11 AM','12 PM','1 PM','2 PM','3 PM','4 PM','5 PM'].map(t=>`<span>${t}</span>`).join('')}</div><div class="grid"><div class="now"><span>NOW 11:43</span></div>${jobs.map((j,i)=>`<button class="block" data-block="${i}"><small>${j.kind.toUpperCase()}</small><strong>${j.name}</strong><span>${j.detail}</span></button>`).join('')}</div>`;document.querySelectorAll('[data-block]').forEach(b=>{b.onclick=()=>modal(b.dataset.block);b.draggable=true;b.ondragend=()=>modal('recurrence')})}else if(view==='Month'){cal.innerHTML=`<div class="month">${['MON','TUE','WED','THU','FRI','SAT','SUN'].map(d=>`<div class="day">${d}</div>`).join('')}${Array.from({length:35},(_,i)=>{let n=i<1?31:i>30?i-30:i;return `<button class="${n===23?'today':''}" data-date="${n}">${n}${n===23?'<br><small>4 items today</small>':''}</button>`}).join('')}</div>`;document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>modal('event'))}else{cal.innerHTML=`<div class="week">${['MON','TUE','WED','THU','FRI','SAT','SUN'].map((d,i)=>`<div>${d} ${21+i}${i<4?`<button data-week="${i}">${jobs[i].name}</button>`:''}</div>`).join('')}</div>`;document.querySelectorAll('[data-week]').forEach(b=>b.onclick=()=>modal(b.dataset.week))}
$('workspace').innerHTML=workspace==='Browser'?'<input class="address" value="localhost:7341/litetui-sidecar" aria-label="Sample address"><div class="canvas"><div><div class="orb">◎</div><span class="eyebrow">CONNECTED WORKSPACE</span><h2>Your web, in view.</h2><p>Visual preview only. No page is loaded or controlled.</p><button class="gold" id="previewError">Preview failure</button></div></div>':'<div class="eyebrow" style="margin:17px 0">RECENT OUTPUT · SAMPLE FILES</div>'+['timeline-concept.png','dashboard-preview.html','walkthrough.mp4'].map(f=>`<button class="artifact" data-artifact="1">${f}<small>Sample only · no file loaded</small></button>`).join('');$('workspace').querySelectorAll('[data-artifact]').forEach(b=>b.onclick=()=>modal('error'));if($('previewError'))$('previewError').onclick=()=>modal('error');const address=$('workspace').querySelector('.address');if(address)address.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();modal('error')}};
}
function renderSettings(){$('stage').innerHTML=`<aside class="rail"><div class="eyebrow">PREFERENCES</div>${categories.map(c=>`<button class="setting ${c===category?'active':''}" data-category="${c}">${c}<small>${c==='Model'?'Connection & engine':c==='Themes'?'Active theme & tokens':'Representative section'}</small></button>`).join('')}</aside><main class="settingsPanel"><div class="eyebrow">PERSONALIZE YOUR WORKSPACE</div><h2>${category}</h2><p>Representative ${category.toLowerCase()} controls. This preview does not modify LiteTUI.</p><div class="card"><h3>01 &nbsp; ${category==='Themes'?'Appearance':'Section options'}</h3><div class="row"><span>${category==='Themes'?'Active theme':category==='Model'?'Default model':'Sample preference'}</span><select><option>${category==='Themes'?'Oscura Midnight':'Current default'}</option><option>Preview alternate</option></select></div><div class="row"><span>Secondary option</span><input type="checkbox" aria-label="Sample toggle"></div></div><p class="disconnected">Sample controls only · no persistence or runtime effects.</p></main><aside class="aside"><span class="eyebrow">AT A GLANCE</span><strong>10</strong><p>Settings categories from LiteTUI. Full field/action parity requires parent integration.</p><p>STATUS · Native presentation preview</p></aside>`;document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{category=b.dataset.category;render()})}
render();
</script></body></html>
