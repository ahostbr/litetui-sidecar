[package]
name = "litetui-sidecar"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Optional LiteTUI settings, calendar and browser sidecar"
license = "MIT"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tao = "0.37.0"
wry = "0.57.0"
percent-encoding = "2.3.2"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.11"
